name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NEXT_PUBLIC_FIREBASE_API_KEY: ci-test-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: localhost
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-web-reader
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-web-reader.appspot.com
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
  NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:ci-test"
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-test.apps.googleusercontent.com

jobs:
  static-node-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  playwright-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --workers=1

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser:ci
